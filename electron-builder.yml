appId: com.reastudio.desktop
productName: REA Studio
copyright: Copyright © 2026 Miguel
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: resources
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
  # resedit escribe icono y versión. signExecutable: false omite la firma: no hay certificado.
  signExecutable: false
  requestedExecutionLevel: asInvoker
  artifactName: REA-Studio-${version}-win-x64.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  unicode: true
  displayLanguageSelector: true
  installerLanguages:
    - es_ES
    - en_US
  shortcutName: REA Studio
mac:
  # identity null y notarize false: sin firma y sin notarización. No hay certificado.
  identity: null
  notarize: false
  hardenedRuntime: false
  gatekeeperAssess: false
  # Electron 45 exige macOS 13. Sequoia 15 lo supera; no se pide un macOS más nuevo.
  minimumSystemVersion: "13.0"
  category: public.app-category.developer-tools
  target:
    - target: zip
      arch:
        - x64
  artifactName: REA-Studio-${version}-mac-x64.${ext}
